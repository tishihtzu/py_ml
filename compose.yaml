services:
  jupyter:
    build: .
    container_name: jupyter
    restart: unless-stopped

    # Docker Stacks adjusts jovyan's identity, then drops privileges.
    user: root

    ports:
      - "127.0.0.1:8888:8888"

    environment:
      NB_UID: "${NB_UID:-1000}"
      NB_GID: "${NB_GID:-1000}"
      CHOWN_HOME: "yes"
      KERAS_BACKEND: tensorflow

    volumes:
      - "${NOTEBOOK_DIR:-${HOME}/wrk}:/home/jovyan/work"

    command:
      - start-notebook.py
      - --ServerApp.root_dir=/home/jovyan/work
      - --ServerApp.token=
      - --ServerApp.password=
